<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Catalog</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <span class="logo-icon"></span>
                    <span class="logo-text">Hex Catalog</span>
                </div>
            </div>
            <div class="header-right">
                <div class="dropdown">
                    <button class="header-btn dropdown-toggle" data-dropdown="links">
                        <i class="fa-solid fa-link"></i> Links
                        <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
                    </button>
                    <div class="dropdown-menu" id="dropdown-links">
                        <button onclick="window.open('https://dsc.gg/hexcapes', '_blank')">
                            <i class="fa-brands fa-discord"></i> Discord
                        </button>
                        <button onclick="window.open('https://modrinth.com/mod/hex-capes/versions', '_blank')">
                            <i class="fa-solid fa-download"></i> Download Mod
                        </button>
                        <button id="how-to-use-btn" onclick="window.open('https://hexcapes.qzz.io/docs', '_blank')">
                            <i class="fa-solid fa-question-circle"></i> How to Use
                        </button>
                    </div>
                </div>
                <div class="dropdown">
                    <button class="header-btn dropdown-toggle" data-dropdown="tools">
                        <i class="fa-solid fa-screwdriver-wrench"></i> Tools
                        <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
                    </button>
                    <div class="dropdown-menu" id="dropdown-tools">
                        <button id="bedrock-catalog-bug-btn" onclick="window.open('/bedrock', '_blank')">
                            <i class="fa-solid fa-cube"></i> Bedrock Catalog
                        </button>
                        <button id="cape-template-bug-btn" onclick="window.open('/template/java', '_blank')">
                            <i class="fa-solid fa-file-zipper"></i> Cape Template
                        </button>
                        <button id="open-studio-btn">
                            <i class="fa-solid fa-paintbrush"></i> Creator Studio
                        </button>
                        <button>
                            <i class="fa-solid fa-arrow-up-from-bracket"></i> Submit Cape
                        </button>
                    </div>
                </div>
                <button class="header-btn user-chip" id="header-account-chip" >
                    <span class="user-chip-avatar" aria-hidden="true"></span>
                    <span class="user-chip-text">
                        <span id="header-ign">[ign]</span>
                        <span id="header-discord">{discordid}</span>
                    </span>
                    <i class="fa-solid fa-angle-down user-chip-caret"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Left Sidebar - Player Preview -->
            <aside class="sidebar">
                <h3>In-Game Player Preview</h3>
                <canvas id="skin_container"></canvas>
                <div class="player-info">
                    <div class="info-row">
                        <i class="fa-solid fa-id-card"></i>
                        <span class="info-label">Cape:</span>
                        <span id="capeid">null</span>
                    </div>
                    <div class="info-row">
                        <i class="fa-solid fa-user"></i>
                        <p id="username">null</p>
                    </div>
                    <div class="info-row">
                        <i class="fa-brands fa-discord"></i>
                        <p id="discordtag">null</p>
                    </div>
                    <button class="skin-upload-btn" id="skin-upload-btn">
                        <i class="fa-solid fa-shirt"></i> Upload Skin
                    </button>
                </div>
            </aside>

            <!-- Right Content - Cape Library -->
            <main class="content">
                <section class="cape-library-section">
                    <h2>Cape Library</h2>
                    <div id="cape-selector-wrapper">
                        <div id="loading-spinner" class="loading-spinner">
                            <i class="fa-solid fa-spinner"></i>
                            <p>Loading capes...</p>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
<!--
    <script src="https://cdn.jsdelivr.net/npm/skinview3d@latest/bundles/skinview3d.bundle.js"></script>
-->
    <script src="./packages/skinview3d.bundle.js"></script>
    <script type="module" src="./index.js"></script>
</body>
</html>
